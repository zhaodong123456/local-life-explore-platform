# 本地生活探店平台 - 前端 Nginx 配置
# 1. SPA history 路由 fallback（前端路由刷新不 404）
# 2. /api/ 反代到 compose 内的 backend 服务（等价于开发时 vite.config.js 的 /api 代理）

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    # SPA history 路由：静态文件找不到时回退到 index.html，交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反代：/api/** -> backend:8080/api/**
    # （backend 是 docker-compose 中的服务名，容器网络内直接解析）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 秒杀/长轮询等场景放宽超时
        proxy_read_timeout 60s;
    }
}
